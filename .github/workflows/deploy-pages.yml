name: Atualizar TSE e publicar GitHub Pages

on:
  workflow_dispatch:
  schedule:
    # 06:45, 12:45 e 18:45 no horário de Brasília (UTC-3).
    - cron: '45 9,15,21 * * *'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'data-src/**'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Derivar mudanças a partir dos Dados Abertos oficiais do TSE
        run: >-
          python scripts/derive_tse_changes.py
          --out .cache/alteracoes-oficiais.csv
          --meta-out .cache/alteracoes-oficiais.meta.json
          --locations-out .cache/eleitorado_local_votacao_2026.zip
          --detail-out .cache/detalhe_votacao_secao_2026.zip

      - name: Mostrar resumo da captura
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('.cache/alteracoes-oficiais.meta.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          print('Método:', d.get('derivation_method'))
          print('Seções derivadas como alteradas:', d.get('derived_changed_sections'))
          print('SHA cadastro atual:', d.get('sha256'))
          print('SHA baseline:', d.get('baseline_sha256'))
          PY

      - name: Gerar base nacional do site
        run: >-
          python scripts/build_data.py
          --changes-file .cache/alteracoes-oficiais.csv
          --snapshot-meta .cache/alteracoes-oficiais.meta.json
          --locations-file .cache/eleitorado_local_votacao_2026.zip
          --out site/data

      - name: Validar saída pública
        run: python scripts/validate_data.py site/data --min-changed-sections 1

      - name: Guardar snapshot auditável
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-tse-${{ github.run_number }}
          path: |
            .cache/alteracoes-oficiais.csv
            .cache/alteracoes-oficiais.meta.json
          retention-days: 14

      - name: Validar frontend do mapa
        shell: bash
        run: |
          if grep -R "__CARTO_BASEMAP_KEY__\|cartocdn.com" -n site; then
            echo "::error::Referência antiga da CARTO ainda encontrada no frontend."
            exit 1
          fi
          echo "Mapa-base sem chave externa obrigatória: OK."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
